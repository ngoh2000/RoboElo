[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roboelo"
version = "0.2.0"
description = "Joint rating of robot policies and simulation tasks on one Elo scale across benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
# only the rating package; scripts/, experiments/ and server/ are run as files
packages = ["roboelo"]
